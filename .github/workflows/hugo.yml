name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUGO_VERSION: '0.145.0'
      HUGO_ENVIRONMENT: production
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pages API probe (non-blocking)
        continue-on-error: true
        run: |
          api="${{ github.api_url }}/repos/${{ github.repository }}/pages"
          {
            echo "GET ${api}"
            curl -sS -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' "${api}"
            echo ''
            echo "POST ${api} (build_type=workflow)"
            curl -sS -X POST -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d '{"build_type":"workflow"}' "${api}"
          } 2>&1 | tee pages.log

      - name: Install Hugo
        id: install
        run: |
          wget -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" 2>&1 | tee install.log
          sudo dpkg -i /tmp/hugo.deb 2>&1 | tee -a install.log
          hugo version | tee -a install.log

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Hugo
        id: build
        run: |
          set -o pipefail
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 2>&1 | tee hugo.log
          ls -la public | head -20

      - name: Upload artifact
        id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo "Step outcomes: install=${{ steps.install.outcome }} pages=${{ steps.pages.outcome }} build=${{ steps.build.outcome }} artifact=${{ steps.artifact.outcome }} deployment=${{ steps.deployment.outcome }}"
            for f in pages.log install.log hugo.log; do
              if [ -f "$f" ]; then
                echo ''
                echo "### ${f}"
                echo '```'
                tail -n 80 "${f}"
                echo '```'
              fi
            done
          } > body.md
          gh issue create --title "[CI] ${{ github.workflow }} 失败 #${{ github.run_number }}" --body-file body.md
